# Jeden Morgen: winget-Index holen, data/*.json neu schreiben, committen, Seite ausliefern.
# Bei jedem Push auf main wird nur ausgeliefert. Pages-Quelle in den Repo-Einstellungen: „GitHub Actions“.
name: Daten auffrischen und ausliefern

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: winget-Index auswerten
        if: github.event_name != 'push'
        run: python3 tools/aktualisieren.py

      - name: Neuen Stand committen
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data; then echo "Keine Änderung."; exit 0; fi
          git config user.name "wingetarium-bot"
          git config user.email "wingetarium-bot@users.noreply.github.com"
          git add data
          git commit -m "Daten: Stand vom $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
